name: Velocity Norwegian - Daily YouTube Upload

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      upload_youtube:
        description: 'Upload to YouTube? (auto = alternate days, true = force upload, false = skip)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - 'true'
          - 'false'
      category:
        description: 'Category (optional, random if empty)'
        required: false
        default: ''
      phrases:
        description: 'Number of phrases (default: 60)'
        required: false
        default: '60'

jobs:
  generate-youtube-video:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download phrase history
        uses: actions/download-artifact@v4
        id: download-history
        continue-on-error: true
        with:
          name: norwegian-longform-phrase-history
          path: output/history/

      - name: Initialize history if not found
        run: |
          mkdir -p output/history
          if [ ! -f "output/history/all_generated_phrases.json" ]; then
            echo '{"phrases": [], "last_updated": null}' > output/history/all_generated_phrases.json
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          echo "System dependencies installed (fonts are in repo)"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f "upload/requirements.txt" ]; then
            pip install -r upload/requirements.txt
          fi

      - name: Create .env file from secrets
        run: |
          echo "POLLINATIONS_API_KEY=${{ secrets.POLLINATIONS_API_KEY }}" >> .env
          echo "AI_MODEL=${{ secrets.AI_MODEL || 'gemini-fast' }}" >> .env
          echo "YT_CLIENT_ID=${{ secrets.YT_CLIENT_ID }}" >> .env
          echo "YT_CLIENT_SECRET=${{ secrets.YT_CLIENT_SECRET }}" >> .env
          echo "YT_REFRESH_TOKEN=${{ secrets.YT_REFRESH_TOKEN }}" >> .env
          echo "FACEBOOK_ACCESS_TOKEN=${{ secrets.FACEBOOK_ACCESS_TOKEN }}" >> .env
          echo "FACEBOOK_PAGE_ID=${{ secrets.FACEBOOK_PAGE_ID }}" >> .env

      - name: Generate Long-Form YouTube Video
        id: generate
        run: |
          python youtube_longform_automation.py
          LATEST_DIR=$(ls -td output/longform_videos/*/ | head -1)
          echo "LATEST_VIDEO_DIR=$LATEST_DIR" >> $GITHUB_OUTPUT

      - name: 📅 Check YouTube upload schedule (Alternate days)
        id: yt_schedule
        run: |
          INPUT_CHOICE="${{ github.event.inputs.upload_youtube }}"
          if [ "$INPUT_CHOICE" = "true" ]; then
            echo "should_upload=true" >> "$GITHUB_OUTPUT"
            echo "Manual override: YouTube upload forced to TRUE."
          elif [ "$INPUT_CHOICE" = "false" ]; then
            echo "should_upload=false" >> "$GITHUB_OUTPUT"
            echo "Manual override: YouTube upload forced to FALSE."
          else
            # Alternate-day schedule based on UTC Day of the Year
            # Odd days (e.g. 283, 285...) = Upload to YouTube
            # Even days (e.g. 284, 286...) = Skip YouTube (1-day gap)
            DAY_OF_YEAR=$(date -u +%-j)
            echo "Current UTC Day of Year: $DAY_OF_YEAR"
            if [ $(( 10#$DAY_OF_YEAR % 2 )) -ne 0 ]; then
              echo "should_upload=true" >> "$GITHUB_OUTPUT"
              echo "✅ Today is a scheduled YouTube upload day (Day $DAY_OF_YEAR)."
            else
              echo "should_upload=false" >> "$GITHUB_OUTPUT"
              echo "⏸️ Today is an alternate off-day for YouTube (Day $DAY_OF_YEAR). Skipping YouTube upload (Facebook will still upload)."
            fi
          fi

      - name: Upload to YouTube
        if: steps.yt_schedule.outputs.should_upload == 'true'
        id: youtube-upload
        continue-on-error: true
        run: |
          LATEST_DIR=$(ls -td output/longform_videos/*/ | head -1)
          export YT_CLIENT_ID="${{ secrets.YT_CLIENT_ID }}"
          export YT_CLIENT_SECRET="${{ secrets.YT_CLIENT_SECRET }}"
          export YT_REFRESH_TOKEN="${{ secrets.YT_REFRESH_TOKEN }}"
          export PYTHONPATH="${{ github.workspace }}/upload:$PYTHONPATH"
          cd upload
          python upload_youtube_longform.py

      - name: 📘 Upload to Facebook Page
        id: facebook-upload
        continue-on-error: true
        env:
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        run: |
          export PYTHONPATH="${{ github.workspace }}:${{ github.workspace }}/upload:$PYTHONPATH"
          if [ -f "upload_to_facebook.py" ]; then
            python upload_to_facebook.py
          elif [ -f "upload/upload_facebook.py" ]; then
            cd upload && python upload_facebook.py
          fi

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: velocity-norwegian-video-${{ github.run_number }}
          path: |
            ${{ steps.generate.outputs.LATEST_VIDEO_DIR }}final_video.mp4
            ${{ steps.generate.outputs.LATEST_VIDEO_DIR }}thumbnail.jpg
          retention-days: 7

      - name: Upload Phrase History
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: norwegian-longform-phrase-history
          path: output/history/all_generated_phrases.json
          retention-days: 90
          overwrite: true
